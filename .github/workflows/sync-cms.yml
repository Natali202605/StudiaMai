name: Publish admin edits

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy admin edits into the site files
        run: python scripts/sync-cms.py
      - name: Commit published data
        run: |
          git config user.name "Studia Mai"
          git config user.email "cms@studiamai.local"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Опубликовать правки из админки."
            git push
          fi
